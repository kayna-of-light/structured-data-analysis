# Remission Analysis Dataset Registry
#
# This registry defines which files from the canonical data store
# are used for spontaneous remission analysis.
#
# Rather than duplicating NDE data files, this registry references
# subsets of the canonical data store plus remission-specific sources.

name: remission-analysis
description: Spontaneous remission analysis dataset registry
version: "1.0.0"

datasets:
  # Subset of NDE data relevant to remission research
  # (cases involving healing, medical conditions, etc.)
  nderf:
    description: NDERF cases relevant to remission research
    source_path: ../../data/nderf  # Reference canonical store
    files:
      # List specific files or patterns relevant to remission research
      # This is a subset of the full NDERF dataset
      - "*.json"  # Initially include all, refine based on analysis
    exclude: []

  iands:
    description: IANDS cases relevant to remission research  
    source_path: ../../data/iands
    files:
      - "*.json"  # Initially include all, refine based on analysis
    exclude: []

  # Remission-specific data sources
  pmc:
    description: PubMed Central spontaneous remission case reports
    source_path: ../../data/pmc
    files: "*"
    exclude: []

  radical_remission:
    description: Radical Remission Project database cases
    source_path: ../../data/radical_remission
    files: "*"
    exclude: []

  # Structured analysis outputs
  pmc_structured:
    description: Structured analysis results for PMC data
    source_path: ../structured/pmc
    files: "*"
    exclude: []

  rrp_structured:
    description: Structured analysis results for Radical Remission data
    source_path: ../structured/rrp
    files: "*"
    exclude: []
