# NDE Analysis Dataset Registry
# 
# This registry defines which files from the canonical data store
# are used for NDE (Near-Death Experience) analysis.
# 
# Data is stored in ../data/ and referenced by this registry.

name: nde-analysis
description: NDE (Near-Death Experience) analysis dataset registry
version: "1.0.0"

datasets:
  nderf:
    description: NDERF (Near Death Experience Research Foundation) experiences
    source_path: ../../data/nderf  # Relative to registry file
    files: "*"  # Include all JSON files
    exclude: []

  iands:
    description: IANDS (International Association for Near-Death Studies) accounts
    source_path: ../../data/iands  # Relative to registry file
    files: "*"  # Include all JSON files
    exclude: []

  # Structured analysis outputs
  nderf_structured:
    description: Structured analysis results for NDERF data
    source_path: ../structured/nderf
    files: "*"
    exclude: []

  iands_structured:
    description: Structured analysis results for IANDS data  
    source_path: ../structured/iands
    files: "*"
    exclude: []
