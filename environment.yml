name: structured-data-analysis
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.11
  
  # Data manipulation
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.11
  
  # Visualization
  - matplotlib>=3.8
  - seaborn>=0.13
  - plotly>=5.18
  
  # Statistics
  - statsmodels>=0.14
  - scikit-learn>=1.3
  
  # Jupyter
  - jupyter>=1.0
  - jupyterlab>=4.0
  - ipykernel>=6.25
  - ipywidgets>=8.1
  - nbformat>=5.9
  
  # Web scraping
  - requests>=2.31
  - beautifulsoup4>=4.12
  - lxml>=5.0
  - selenium>=4.15
  
  # PDF generation
  - reportlab>=4.0
  
  # Utilities
  - pydantic>=2.5
  - python-dotenv>=1.0
  - tqdm>=4.66
  - tabulate>=0.9
  
  # Testing
  - pytest>=7.0
  - pytest-asyncio>=0.21
  
  # Development
  - pip>=23.0
  
  - pip:
    # Azure OpenAI
    - openai>=1.30.0
